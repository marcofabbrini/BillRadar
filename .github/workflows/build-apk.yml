name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Compila APK (debug, installabile)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rinomina APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BillRadar.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BillRadar-apk
          path: BillRadar.apk

      - name: Pubblica release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BillRadar (ultima build)
          files: BillRadar.apk
